# В сборку попадает как default.conf, поэтому является дополнительным
# Глобальные директивы worker_processes, events, http в таком случае не нужны

#worker_processes 1;

#events {
#    worker_connections 1024;
#}

#http {
    #include /etc/nginx/mime.types;
    #default_type application/octet-stream;

	# Server: nginx (убирает версию nginx в заголовке Server)
	server_tokens off;

	gzip on;
	gzip_comp_level 5;
	gzip_min_length 256;
	#gzip_proxied any; any - ответы с backend сжимаются, off - не сжимаются
	gzip_proxied off; 
	gzip_vary on;
	gzip_disable "msie6";
	
	gzip_types
		text/plain
		text/css
		application/json
		application/javascript
		text/xml
		application/xml
		application/xml+rss
		text/javascript
		image/svg+xml;     
    
	upstream backend {
        server backend:8080;
    }

    server {
        listen 80;
		# server_name заменить на ip адрес виртуальной машины
		# aeza.net
        server_name 178.236.254.157;
		# ruvds.com		
        #server_name 194.87.95.240; 

        root /usr/share/nginx/html;
        index index.html;

		location /.well-known/acme-challenge/ {
			root /var/www/certbot;
		}
		
		location / {
			return 301 https://$host$request_uri;
		}
    }
	
	server {
		listen 443 ssl;
		server_name 178.236.254.157;
		
		ssl_certificate /etc/letsencrypt/live/178.236.254.157/fullchain.pem;
		ssl_certificate_key /etc/letsencrypt/live/178.236.254.157/privkey.pem;
	
		ssl_protocols TLSv1.2 TLSv1.3;
	
		root /usr/share/nginx/html;
		index index.html;
	
		add_header X-Frame-Options "SAMEORIGIN" always; 
		# 'unsafe-inline' - для <div style=""> если сломаются стили
		add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'self';" always;
		# обращение только по https на год
		add_header Strict-Transport-Security "max-age=31536000" always;
		add_header X-Content-Type-Options "nosniff" always; 
	
		 # Frontend
        location / {
            try_files $uri $uri/ /index.html;
			
			add_header Cache-Control "no-cache" always;
        }

		location /assets/ {
			add_header Cache-Control "public, max-age=7884000, immutable" always;
		}

        # Backend
        location /api/ {
            proxy_pass http://backend;

            proxy_http_version 1.1;
			
			add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;

			proxy_cache_bypass $http_upgrade;
			
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
        }
	
	}
#}